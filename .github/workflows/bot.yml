name: Leonida Clips bot

on:
  schedule:
    - cron: "17 */4 * * *"      # every 4 hours (at :17 past, to dodge GitHub's busy top-of-hour)
  workflow_dispatch:            # lets you press "Run workflow" by hand
    inputs:
      dry_run:
        description: "Test only (build shorts, don't upload)"
        type: boolean
        default: false

permissions:
  contents: write               # so it can save posted.json (the list of clips already used)

concurrency:
  group: clipper
  cancel-in-progress: false     # never run two at once (would double-post)

defaults:
  run:
    working-directory: leonida-bot   # the bot's files live in this folder

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: leonida-bot/requirements.txt

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Put the music next to the bot
        run: cp -r ../music ./music

      - name: Run the bot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -u clipper.py --dry-run
          else
            python -u clipper.py
          fi

      - name: Save posted-clips list
        if: always()
        run: |
          git config user.name "leonida-bot"
          git config user.email "leonida-bot@users.noreply.github.com"
          git add posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "posted clips update" && git push)

      - name: Keep the shorts and log for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-and-log
          path: |
            leonida-bot/shorts/*.mp4
            leonida-bot/clipper.log
          retention-days: 7
          if-no-files-found: ignore
